services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: chronocrack:1.0.0
    container_name: chronocrack-web
    restart: unless-stopped
    env_file: .env
    environment:
      CHRONOCRACK_MAX_RANGE: ${CHRONOCRACK_MAX_RANGE:-5000000}
    expose:
      - "8000"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8000/healthz').status==200 else sys.exit(1)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  nginx:
    image: nginx:1.27.3-alpine
    container_name: chronocrack-nginx
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - internal
      - edge
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  internal:
    driver: bridge
  # Rede externa partilhada, atras da qual o proxy nginx vive (convencao do repo).
  edge:
    external: true
    name: edge
